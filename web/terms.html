<article aria-labelledby="doc-title" style="flex: 999 1 560px; min-width: 0; max-width: 780px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #E4E4E7;">
<h1 id="doc-title" style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em;">COMFIT 서비스 이용약관</h1>
<span style="font-size: 13px; color: #71717A;">시행일 [사업자 확인 필요] · 공고일 [사업자 확인 필요]</span>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관은 COMFIT 웹사이트와 검진 프로그램을 이용하는 모든 회원에게 적용됩니다. 거래 유형별 역할, 수수료, 환불과 보증의 세부 기준은 <a href="policy.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">운영 정책</a>에서, 개인정보 처리는 <a href="privacy.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">개인정보처리방침</a>에서 따로 안내합니다.</p>
</div>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제1장 총칙</h2>
<section id="t1" aria-labelledby="t1-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t1-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제1조 (목적)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관은 [사업자 확인 필요: 상호](이하 "회사")가 운영하는 COMFIT 웹사이트와 검진 프로그램(이하 합하여 "서비스")에서 제공하는 PC 부품 검진, 검진 결과표 발급과 진위 확인, 중고 PC 부품의 판매와 거래 중개 등의 이용과 관련하여 회사와 회원의 권리·의무 및 책임사항을 정하는 것을 목적으로 합니다.</p>
</section>
<section id="t2" aria-labelledby="t2-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t2-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제2조 (정의)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관에서 쓰는 용어의 뜻은 다음과 같습니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"회원"이란 이 약관에 동의하고 회원가입을 하여 서비스를 이용하는 자를 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"검진 프로그램"이란 회사가 배포하는 Windows용 프로그램으로, PC 부품에 단계별로 부하를 걸고 사용률·클럭·온도·전력·응답 시간 등의 반응을 측정하는 소프트웨어를 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"결과표"란 검진 프로그램의 측정 결과를 정리한 문서를 말하고, "검진 번호"란 결과표마다 발급되는 고유 번호(CF-로 시작)를 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"직접 판매 상품"이란 회사가 판매자로서 판매하는 상품을 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"사업자 판매 상품"이란 사업자인 판매자(이하 "사업자 판매자")가 회사의 중개를 통해 판매하는 상품을 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"장터"란 사업자가 아닌 개인(이하 "개인 판매자")이 다른 회원과 직접 거래하기 위해 상품을 올리는 공간을 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"판매자"란 사업자 판매자와 개인 판매자를 함께 이르고, "구매자"란 서비스에서 상품을 사는 회원을 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"체결"이란 구매 의사와 판매 의사가 일치하여 판매자와 구매자 사이에 매매계약이 성립하는 것을 말합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">"구매안전서비스"란 구매자가 상품을 받고 확인할 때까지 결제대금을 제3자가 보관하는 결제대금예치(에스크로) 등의 서비스를 말합니다.</li>
</ol>
</section>
<section id="t3" aria-labelledby="t3-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t3-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제3조 (약관의 게시와 개정)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 이 약관의 내용과 상호, 대표자, 사업장 주소, 연락처, 사업자등록번호, 통신판매업 신고번호 등을 회원이 쉽게 알 수 있도록 서비스 초기 화면 하단에 게시합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 「약관의 규제에 관한 법률」, 「전자상거래 등에서의 소비자보호에 관한 법률」(이하 "전자상거래법"), 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 등 관련 법령을 위반하지 않는 범위에서 이 약관을 개정할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사가 약관을 개정하면 적용일자와 개정 사유를 밝혀 적용일 7일 전부터 공지사항에 게시합니다. 회원에게 불리한 변경은 적용일 30일 전부터 게시하고 이메일 등으로 개별 통지합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사가 제3항에 따라 공지·통지하면서 적용일까지 거부 의사를 밝히지 않으면 동의한 것으로 본다는 뜻을 명확히 알렸는데도 회원이 거부 의사를 밝히지 않은 경우, 회원이 개정 약관에 동의한 것으로 봅니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 개정 약관에 동의하지 않으면 이용계약을 해지할 수 있습니다.</li>
</ol>
</section>
<section id="t4" aria-labelledby="t4-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t4-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제4조 (약관 외 준칙)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관에서 정하지 않은 사항은 관련 법령과 회사가 정한 운영 정책(운영 정책, 검수 기준, 거래 금지 품목, 신고·분쟁 조정 기준)에 따릅니다. 운영 정책이 이 약관과 다르면 이 약관이 우선합니다.</p>
</section>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제2장 회원</h2>
<section id="t5" aria-labelledby="t5-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t5-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제5조 (회원가입)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">이용자는 회사가 정한 가입 양식에 정보를 입력하고 이 약관과 개인정보 수집·이용에 동의하여 회원가입을 신청합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">만 14세 미만은 회원가입을 할 수 없습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 다음 중 하나에 해당하는 신청은 승낙하지 않을 수 있고, 승낙 후에 알게 된 경우 이용계약을 해지할 수 있습니다.</li>
</ol>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">다른 사람의 명의나 정보를 이용한 경우</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">가입 정보를 거짓으로 적거나 빠뜨린 경우</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관에 따라 회원 자격을 잃은 적이 있는 경우(회사가 재가입을 승낙한 경우는 제외)</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">법령이나 이 약관을 위반할 목적으로 신청한 경우</li>
</ul>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">개인 판매자는 처음 판매하기 전에 법령이 정한 신원정보 확인을 거쳐야 하며, 사업자 판매자는 상호, 대표자, 사업자등록번호, 통신판매업 신고번호 등 사업자 정보를 등록해야 합니다.</p>
</section>
<section id="t6" aria-labelledby="t6-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t6-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제6조 (회원 정보의 변경)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 마이페이지에서 자신의 정보를 열람하고 고칠 수 있습니다. 가입 때 입력한 정보가 바뀌었는데 고치지 않아 생긴 불이익은 회원이 부담합니다.</p>
</section>
<section id="t7" aria-labelledby="t7-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t7-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제7조 (계정의 관리)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">계정(이메일)과 비밀번호를 관리할 책임은 회원에게 있으며, 회원은 이를 다른 사람이 쓰게 해서는 안 됩니다. 계정이 도용된 사실을 알게 되면 바로 회사에 알리고 회사의 안내에 따라야 합니다.</p>
</section>
<section id="t8" aria-labelledby="t8-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t8-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제8조 (탈퇴와 자격 제한)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 언제든지 마이페이지에서 탈퇴를 요청할 수 있으며, 회사는 바로 처리합니다. 다만 진행 중인 거래나 정산이 있으면 그 거래가 끝난 뒤에 처리합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원이 제24조의 금지 행위를 하면 회사는 운영 정책에 따라 경고, 거래 제한, 이용 정지, 이용계약 해지의 조치를 할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사가 이용계약을 해지하려면 회원에게 사유를 알리고 소명할 기회를 줍니다. 다만 법령 위반으로 다른 회원에게 피해가 생길 우려가 큰 경우에는 먼저 이용을 정지한 뒤 소명 기회를 줄 수 있습니다.</li>
</ol>
</section>
<section id="t9" aria-labelledby="t9-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t9-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제9조 (회원에 대한 통지)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 회원이 등록한 이메일, 휴대전화 번호, 서비스 내 알림으로 회원에게 통지합니다. 회원 전체에 대한 통지는 공지사항에 7일 이상 게시하는 것으로 갈음할 수 있습니다. 다만 회원의 거래에 중대한 영향을 주는 사항은 개별 통지합니다.</p>
</section>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제3장 서비스</h2>
<section id="t10" aria-labelledby="t10-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t10-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제10조 (서비스의 내용)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 다음 서비스를 제공합니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 프로그램 배포와 결과표 발급</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 번호를 이용한 결과표 진위 확인</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">공모전 등 이벤트</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">직접 판매, 사업자 판매 중개, 장터 등 중고 PC 부품 거래 서비스</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">체결된 거래를 바탕으로 한 시세 정보 제공</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">그 밖에 회사가 정하여 공지하는 서비스</li>
</ol>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">거래 서비스(제4호·제5호)와 제4장의 규정은 회사가 거래 서비스의 개시를 공지한 날부터 적용합니다. 그 전까지 SHOP·장터·시세에 표시되는 상품과 가격은 화면 예시이며 청약의 대상이 아닙니다.</p>
</section>
<section id="t11" aria-labelledby="t11-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t11-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제11조 (서비스의 변경과 중단)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">서비스는 연중무휴 하루 24시간 제공하는 것을 원칙으로 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 설비의 점검·교체·고장, 통신 장애 등의 사유가 있으면 서비스를 일시 중단할 수 있으며, 미리 공지합니다. 미리 알릴 수 없는 사정이 있으면 사후에 공지합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사가 서비스의 내용을 바꾸면 바뀌는 내용과 사유를 적용일 7일 전부터 공지합니다.</li>
</ol>
</section>
<section id="t12" aria-labelledby="t12-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t12-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제12조 (결과표의 성격)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">결과표는 검진 프로그램이 검진한 시점에 해당 PC 환경에서 측정한 결과를 정리한 것입니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">결과표는 부품의 성능, 수명, 앞으로의 고장 여부를 보증하지 않습니다. 측정 결과는 함께 꽂힌 다른 부품, 드라이버, 전원 설정, 실내 온도 등 환경의 영향을 받을 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 결과표를 위조·변조하거나, 위조·변조된 결과표를 사용해서는 안 됩니다. 결과표가 실제로 발급된 것인지는 <a href="diagnose.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">검진 번호 조회</a>로 확인할 수 있습니다.</li>
</ol>
</section>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제4장 거래 (거래 서비스 개시 후 적용)</h2>
<section id="t13" aria-labelledby="t13-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t13-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제13조 (거래 유형과 회사의 지위)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">서비스의 거래는 다음 세 가지로 나뉘며, 회사는 상품 화면과 주문 화면에 어느 유형인지 표시합니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">직접 판매: 회사가 판매자로서 구매자와 직접 매매계약을 맺습니다. 회사는 통신판매업자로서 상품 정보, 배송, 청약철회와 환불에 대한 책임을 집니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">사업자 판매 중개: 사업자 판매자가 판매자이고 회사는 통신판매중개자입니다. 매매계약의 당사자는 사업자 판매자와 구매자이며, 상품 정보와 거래에 대한 책임은 사업자 판매자에게 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">장터(개인 간 거래): 개인 판매자와 구매자가 직접 거래합니다. 회사는 게시 공간과 분쟁 해결 협조를 제공하며 매매계약의 당사자가 아닙니다.</li>
</ol>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 중개하는 거래에서도 전자상거래법이 통신판매중개자에게 정한 의무(중개자라는 사실의 고지, 판매자 신원정보의 확인과 제공, 분쟁 해결 협조 등)를 집니다.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사가 중개 거래에서 청약의 접수나 대금의 수령 등 판매 업무의 일부를 직접 수행하는 경우, 그 업무에 관하여는 법령에 따라 회사가 책임을 집니다.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 조의 어느 규정도 회사의 고의 또는 과실로 인한 책임을 면제하지 않습니다.</p>
</section>
<section id="t14" aria-labelledby="t14-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t14-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제14조 (판매 등록)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">판매자는 판매하려는 부품을 꽂은 PC에서 검진하여 받은 검진 번호를 판매 등록 때 입력해야 합니다. 판매 등록에 쓸 수 있는 결과표의 유효 기간은 운영 정책에서 정합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">판매자는 결과표의 부품과 실제로 보내는 부품이 같아야 하며, 구성품과 사용 기간을 사실대로 적어야 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">판매자는 수리, 개조, 침수, 채굴 사용, 알고 있는 고장 증상 등 구매 판단에 영향을 주는 이력을 알고 있는 범위에서 상품 정보에 적어야 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">거래 금지 품목은 등록할 수 없으며, 회사는 금지 품목이나 사실과 다른 상품 정보를 발견하면 등록을 숨기거나 삭제할 수 있습니다.</li>
</ol>
</section>
<section id="t15" aria-labelledby="t15-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t15-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제15조 (구매와 체결)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">구매자는 즉시 구매가로 바로 사거나, 원하는 가격으로 구매 입찰을 할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">구매 입찰가와 판매 입찰가가 일치하거나 즉시 구매·즉시 판매가 이루어지면 체결되고, 판매자와 구매자 사이에 매매계약이 성립합니다. 회사는 체결 사실을 양쪽에 바로 알립니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">입찰은 회원이 정한 기한까지 유효하며, 체결 전에는 언제든 취소할 수 있습니다.</li>
</ol>
</section>
<section id="t16" aria-labelledby="t16-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t16-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제16조 (결제와 구매안전서비스)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">직접 판매와 사업자 판매 중개 거래의 대금은 회사가 정한 결제 수단으로 결제합니다. 결제 수단과 구매안전서비스의 내용은 거래 서비스 개시 전에 운영 정책과 결제 화면에 표시합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">장터 거래의 대금 지급 방법은 당사자가 정하되, 회사는 구매안전서비스의 이용을 권고하고 그 방법을 안내합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 결제 전에 상품 금액, 수수료, 배송비와 총 결제 금액을 주문 화면에 표시합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">거래가 취소되면 회사는 결제 수단에 따라 지체 없이 환불 절차를 진행합니다.</li>
</ol>
</section>
<section id="t17" aria-labelledby="t17-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t17-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제17조 (발송)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">판매자는 체결 후 운영 정책에서 정한 기한 안에 부품을 보내고 송장 번호를 등록해야 합니다. 기한 안에 보내지 않으면 거래가 취소될 수 있으며, 운영 정책에 따른 페널티가 적용될 수 있습니다.</p>
</section>
<section id="t18" aria-labelledby="t18-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t18-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제18조 (구매 확정)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">구매자는 부품을 받은 뒤 운영 정책에서 정한 기간 안에 상태를 확인하고 구매 확정 또는 이의 제기를 합니다. 회사는 같은 PC가 아니어도 검진 프로그램으로 다시 검진해 결과표와 비교해 볼 것을 권합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">기간 안에 이의 제기가 없으면 구매 확정된 것으로 봅니다. 회사는 자동 확정 전에 구매자에게 이를 알립니다.</li>
</ol>
</section>
<section id="t19" aria-labelledby="t19-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t19-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제19조 (청약철회와 환불)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">직접 판매 상품과 사업자 판매 상품을 산 구매자는 전자상거래법에 따라 계약 내용에 관한 서면을 받은 날부터 7일 이내에 청약을 철회할 수 있습니다. 상품을 그보다 늦게 받았으면 상품을 받은 날부터 7일 이내입니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">상품이 표시·광고 또는 계약 내용과 다르면 상품을 받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내에 철회할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">구매자의 책임으로 상품이 없어지거나 훼손된 경우, 사용으로 가치가 뚜렷이 떨어진 경우 등 법에서 정한 경우에는 철회가 제한됩니다. 내용을 확인하려고 포장을 훼손한 것은 제한 사유가 아니며, 제한되는 경우는 상품 화면에 미리 표시한 때에만 적용합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">단순 변심으로 반품하는 비용은 구매자가, 상품이 표시·광고나 계약 내용과 달라 반품하는 비용은 판매자가 부담합니다. 판매자는 청약철회를 이유로 위약금이나 손해배상을 청구하지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">판매자는 상품을 돌려받은 날부터 3영업일 이내에 대금을 환급하며, 늦어지면 법에서 정한 지연이자를 더해 지급합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">장터 거래에는 전자상거래법의 청약철회 규정이 적용되지 않을 수 있습니다. 다만 받은 상품이 결과표나 상품 설명과 다르면 구매자는 운영 정책에 따라 회사에 분쟁 조정을 요청할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">이 조는 법령이 소비자에게 보장하는 권리를 제한하지 않으며, 회사나 판매자가 따로 약속한 보증은 이에 더하여 적용됩니다.</li>
</ol>
</section>
<section id="t20" aria-labelledby="t20-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t20-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제20조 (수수료)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 거래 수수료 등 서비스 이용 대가를 받을 수 있으며, 그 금액과 부과 기준은 운영 정책과 결제 화면에 표시합니다. 수수료를 새로 정하거나 바꿀 때에는 제3조의 절차를 따릅니다.</p>
</section>
<section id="t21" aria-labelledby="t21-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t21-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제21조 (거래 취소와 페널티)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">체결 후 일방적인 취소, 발송 기한 위반, 결과표와 다른 부품 발송 등이 있으면 회사는 운영 정책에 따라 페널티(위약금, 거래 제한 등)를 적용할 수 있습니다. 페널티의 종류와 기준은 운영 정책에 미리 공지합니다.</p>
</section>
<section id="t22" aria-labelledby="t22-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t22-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제22조 (판매자 정보 확인과 분쟁 협조)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 전자상거래법령이 정한 범위에서 개인 판매자의 신원정보를 확인합니다. 확인 항목: [사업자 확인 필요: 법령 원문 대조 후 기재]</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 사업자 판매자의 상호, 대표자, 주소, 전화번호, 통신판매업 신고번호, 사업자등록번호를 확인하여 청약 전에 구매자가 볼 수 있게 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">개인 판매자와 구매자 사이에 분쟁이 생기면 회사는 소비자피해 분쟁조정기구 또는 법원의 요청이 있거나, 개인 판매자가 동의한 경우 구매자의 요청이 있으면 확인한 신원정보와 거래 내역을 제공하여 분쟁 해결에 협조합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 분쟁을 해결하기 위해 신고 접수, 양쪽의 소명 확인, 결과 통지 등의 절차를 운영하며, 그 기준은 운영 정책에서 정합니다.</li>
</ol>
</section>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제5장 회사와 회원의 의무</h2>
<section id="t23" aria-labelledby="t23-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t23-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제23조 (회사의 의무)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 법령과 이 약관이 금지하는 행위를 하지 않으며, 안정적으로 서비스를 제공하기 위해 노력합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 회원의 개인정보를 보호하기 위해 보안 시스템을 갖추고 개인정보처리방침을 공개하고 지킵니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 회원이 제기한 의견이나 불만이 정당하다고 인정되면 처리하고, 처리 과정과 결과를 회원에게 알립니다.</li>
</ol>
</section>
<section id="t24" aria-labelledby="t24-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t24-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제24조 (회원의 의무와 금지 행위)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 다음 행위를 해서는 안 됩니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">결과표를 위조·변조하거나, 다른 부품으로 받은 검진 번호를 판매 등록에 쓰는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 중에 측정을 일부러 방해하거나 결과를 바꾸려고 PC 설정, 온도, 부하를 조작하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">거래 금지 품목을 등록하거나 상품 정보를 거짓으로 적는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">연락처나 계좌번호를 남기는 등 서비스 밖 거래를 유도하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">시세를 왜곡할 목적으로 거래할 의사 없이 입찰하거나, 여러 계정으로 스스로 거래하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">다른 사람의 정보를 도용하거나, 다른 회원의 개인정보를 거래 목적 밖으로 쓰는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">서비스나 검진 프로그램의 정상적인 운영을 방해하거나 회사의 허락 없이 자동화된 수단으로 정보를 수집하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">그 밖에 법령이나 이 약관을 위반하는 행위</li>
</ol>
</section>
<section id="t25" aria-labelledby="t25-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t25-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제25조 (게시물)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회원이 서비스에 올린 상품 정보, 사진, 문의 글 등 게시물의 책임은 그 회원에게 있습니다. 회사는 게시물이 법령이나 이 약관을 위반하면 게시를 중단하거나 삭제할 수 있으며, 회원이 올린 상품 사진과 상품 정보를 서비스 안에서 해당 상품을 소개하는 데 쓸 수 있습니다.</p>
</section>
<section id="t26" aria-labelledby="t26-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t26-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제26조 (지식재산권)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">서비스, 검진 프로그램, 결과표 양식, 시세 정보에 대한 저작권과 그 밖의 지식재산권은 회사에 있습니다. 다만 검진 프로그램에 포함된 오픈소스 소프트웨어는 각 라이선스를 따릅니다(<a href="licenses.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">오픈소스 라이선스</a>). 회원은 회사의 허락 없이 이를 복제, 배포, 상업적으로 이용해서는 안 됩니다.</p>
</section>
<h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 800; line-height: 1.27; padding-bottom: 10px; border-bottom: 2px solid #09090B;">제6장 기타</h2>
<section id="t27" aria-labelledby="t27-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t27-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제27조 (손해배상)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사 또는 회원이 이 약관을 위반하여 상대방에게 손해를 입히면 그 손해를 배상합니다. 다만 고의 또는 과실이 없으면 그렇지 않습니다.</p>
</section>
<section id="t28" aria-labelledby="t28-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="t28-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제28조 (책임의 제한)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 천재지변, 전쟁, 정전, 통신 사업자의 장애 등 불가항력으로 서비스를 제공할 수 없으면 그 범위에서 책임이 면제됩니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 회원의 귀책사유로 생긴 서비스 이용 장애에 대해 책임지지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 직접 판매 상품에 대해서는 판매자로서, 중개하는 거래에 대해서는 통신판매중개자로서 법령과 이 약관에서 정한 책임을 집니다. 회사의 고의 또는 과실로 회원에게 손해가 생기면 그 손해를 배상합니다.</li>
