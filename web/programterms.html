<article aria-labelledby="doc-title" style="flex: 999 1 560px; min-width: 0; max-width: 780px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #E4E4E7;">
<h1 id="doc-title" style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em;">COMFIT 검진 프로그램 이용약관</h1>
<span style="font-size: 13px; color: #71717A;">시행일 2026. 11. 22. · 적용 버전 1.0.0 이후</span>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이 약관은 COMFIT(이하 "회사")가 배포하는 COMFIT 검진 프로그램(이하 "프로그램")을 내려받거나 실행하는 모든 이용자에게 적용됩니다. 프로그램을 설치하거나 실행하면 이 약관에 동의한 것으로 봅니다.</p>
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #F4F4F5; font-size: 13px; line-height: 1.7; color: #3F3F46;">검진은 부품에 일부러 부하를 거는 검사입니다. 시작 전에 저장하지 않은 작업을 닫고, 노트북은 전원을 연결하고, 검사 중에는 PC를 쓰지 마세요.</p>
</div>
<section id="g1" aria-labelledby="g1-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g1-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제1조 (사용 허락)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 이용자에게 프로그램을 개인 또는 사업장 내부에서 PC를 검진하는 목적으로 무상으로 쓸 수 있는 비독점적 권리를 허락합니다. 프로그램의 저작권은 회사에 있으며, 이 약관이 허락하지 않은 권리는 회사가 가집니다.</p>
</section>
<section id="g2" aria-labelledby="g2-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g2-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제2조 (금지 행위)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이용자는 다음 행위를 해서는 안 됩니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">프로그램을 고쳐 배포하거나, 회사의 허락 없이 다른 곳에 올려 배포하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">결과표, 검진 번호, 데이터 지문을 위조·변조하거나 위조·변조된 결과표를 쓰는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">측정 결과를 바꿀 목적으로 프로그램이나 측정 과정을 조작하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">법령이 허용하는 경우를 제외하고 프로그램을 역설계·역컴파일·분해하는 행위</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">프로그램을 이용해 다른 사람의 PC를 그 사람의 동의 없이 검사하는 행위</li>
</ol>
</section>
<section id="g3" aria-labelledby="g3-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g3-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제3조 (프로그램이 하는 일)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">프로그램은 검진을 위해 다음 작업을 합니다.</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">CPU, 메모리, 저장장치, 그래픽카드에 단계별로 부하를 걸고 사용률, 클럭, 온도, 전력, 응답 시간을 0.5초마다 기록합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">저장장치 검사를 위해 임시 파일을 쓰고 읽은 뒤, 검사가 끝나면 지웁니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">관리자 권한으로 정밀 검진을 실행하면 전원 설정(최대 프로세서 상태)을 잠시 바꾸고, 검사가 끝나면 원래대로 되돌립니다. 정전이나 강제 종료로 되돌리지 못했으면 다음에 프로그램이나 관리자 도우미가 시작할 때 복구 파일(%ProgramData%\COMFIT\restore.json)로 먼저 되돌립니다. 이 밖에 오버클럭, 전압, 팬, BIOS 설정은 바꾸지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">온도가 중단 기준에 닿거나 (CPU·GPU·NVMe SSD는 부품이 알려 주는 한계 온도를 먼저 쓰고 CPU는 그보다 5°C 낮게, 알 수 없으면 CPU 데스크톱 90°C·노트북 95°C, GPU 90°C, NVMe SSD 70°C, SATA SSD 65°C, HDD 55°C), 하드웨어 오류·그래픽 드라이버 리셋·연산 오류·노트북 전원 분리·센서 끊김이 생기면 부하를 바로 멈춥니다. 필요한 온도 센서를 읽을 수 없으면 부하를 낮춰 검사합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">부하 단계 사이에는 온도가 충분히 내려갈 때까지 기다리고, 내려가지 않으면 그 단계를 건너뜁니다. 이용자는 언제든 [중단]을 눌러 멈출 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">측정 기록은 이용자 PC의 %LOCALAPPDATA%\COMFIT 폴더에, 결과표 PDF는 이용자가 고른 위치에 저장합니다.</li>
</ul>
</section>
<section id="g4" aria-labelledby="g4-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g4-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제4조 (수집하고 보내는 정보)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">프로그램은 측정 기록을 이용자의 PC에 저장합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 데이터 업로드는 기본값이 "보내지 않음"이며, 만 14세 이상 이용자가 동의한 때에만 개인을 알아볼 수 없는 검진 데이터(특징값, 점수 요약, 부품 모델명 등)를 보냅니다. 결과표 진위 확인 서명은 이용자가 요청할 때만 결과 요약을 보냅니다. 보내는 항목과 보내지 않는 항목은 <a href="privacy.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">개인정보처리방침</a>에 적습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">새 버전을 확인할 때는 comfit.kr에서 최신 버전 정보를 받기만 하며 개인정보를 보내지 않습니다. 설정에서 끌 수 있고, 프로그램이 스스로 설치하지는 않습니다.</li>
</ol>

</section>
<section id="g5" aria-labelledby="g5-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g5-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제5조 (이용자의 주의 의무)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">이용자는 검사 전에 중요한 자료를 백업하고, 저장하지 않은 작업을 닫아야 합니다. 검사 중 이상한 소리, 냄새, 화면 꺼짐 등이 생기면 바로 프로그램을 멈추고 PC 전원을 끄세요. 이미 결함이 있는 부품은 부하를 거는 동안 증상이 드러날 수 있습니다.</p>
</section>
<section id="g6" aria-labelledby="g6-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g6-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제6조 (결과표의 성격)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">결과표는 검사한 시점에 이용자의 PC 환경에서 측정한 결과이며, 부품의 성능, 수명, 앞으로의 고장 여부를 보증하지 않습니다.</p>
</section>
<section id="g7" aria-labelledby="g7-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g7-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제7조 (업데이트)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 정확도와 안전을 높이기 위해 프로그램을 업데이트할 수 있습니다. 결과표 발급과 진위 확인에는 회사가 정한 버전 이상이 필요할 수 있으며, 바뀐 내용은 <a href="download.html" style="text-decoration: underline; text-underline-offset: 3px; color: #09090B;">다운로드 페이지</a>의 업데이트 내역에 적습니다.</p>
</section>
<section id="g8" aria-labelledby="g8-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="g8-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">제8조 (책임의 제한)</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
