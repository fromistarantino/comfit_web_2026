<script type="text/plain" id="dc-code">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { demo: '', open: '' };
  }
  renderVals() {
    const s = this.state;
    const text = {
      setup: ['다운로드는 아직 준비 중이에요', '서비스가 열리면 이 버튼으로 서명된 설치 파일을 받습니다.'],
      zip: ['다운로드는 아직 준비 중이에요', '서비스가 열리면 설치 없이 압축만 풀어 쓰는 판을 받습니다.'],
      send: ['PC로 보내기는 아직 준비 중이에요', '정식 공개 후 이메일로 이 페이지 링크를 보내 PC에서 열 수 있습니다.'],
      old: ['이전 버전은 정식 공개 후 올라와요', '문제가 생겼을 때 이전 버전으로 돌아갈 수 있도록 남겨 둡니다.']
    };
    const d = text[s.demo] || text.setup;
    const ask = (k) => () => this.setState({ demo: k });
    const logs = [['l1', '1.0.0 (공개 준비 중)', '2026. 11. 22.']]
      .map(([id, ver, date]) => ({ ver, date, open: s.open === id, hint: s.open === id ? '접기' : '보기', toggle: () => this.setState({ open: this.state.open === id ? '' : id }) }));
    return {
      logs,
      demoOpen: !!s.demo, demoTitle: d[0], demoBody: d[1],
      askSetup: ask('setup'), askZip: ask('zip'), askSend: ask('send'), askOld: ask('old'),
      closeDemo: () => this.setState({ demo: '' })
    };
  }
}
</script>
<script src="config.js"></script>
<script src="runtime.js"></script>
</body>
</html>
