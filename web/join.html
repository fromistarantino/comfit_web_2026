<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'self'; object-src 'none'; frame-src 'none'; upgrade-insecure-requests">

<meta property="og:title" content="COMFIT 이벤트 참여하기">
<meta property="og:description" content="무료 PC 검진 리포트를 첨부하고 12문항 설문에 답하면 경품 추첨! COMFIT PC 건강검진 DAY 이벤트에 참여하세요.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="../mobile/mobile.css" data-part="mobile">
</head>
<body>
<div id="app"></div>
<template id="dc">
<div style="display: flex; flex-direction: column; min-width: 0; font-variant-numeric: tabular-nums;">

<div style="background: #18181B; color: #E4E4E7;">
<div class="cf-top" style="max-width: 1200px; margin: 0 auto; padding: 6px 24px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 4px 16px; min-height: 34px; flex-wrap: wrap; font-size: 12px; line-height: 1.5;">
<span><strong style="color: #FFFFFF;">오픈 준비 중</strong><span class="cf-long"> 지금은 무료 PC 검진 이벤트에 참여할 수 있습니다. SHOP·장터·시세와 로그인은 준비 중입니다.</span><span class="cf-short"> 지금은 무료 검진 이벤트만 열려 있어요.</span></span>
<nav aria-label="이용 메뉴" style="display: flex; gap: 18px; color: #A1A1AA;">
<a href="join.html" style="color: #B6F24B; font-weight: 700;">이벤트 참여</a>
<a href="help.html">고객센터</a>
<a href="login.html">로그인</a>
</nav>
</div>
</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #E4E4E7;">
<div class="cf-hd">
<a href="index.html" aria-label="COMFIT 홈" style="display: flex; align-items: center; height: 40px;"><img src="assets/a7a031b26dcac6dd076e4579f3bf8d61.svg" alt="COMFIT" style="height: 24px; width: auto; display: block;"></a>
<nav aria-label="주 메뉴" class="cf-nav">

<a href="diagnose.html">검진</a>
<a href="event.html" aria-current="page" style="font-weight: 700;">이벤트</a>

<a href="price.html">시세</a>
</nav>
<div class="cf-ic">
<a href="search.html" aria-label="검색" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></a>
<a href="mypage.html" aria-label="마이페이지" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
</div>
</div>
</header>

<main style="max-width: 680px; width: 100%; margin: 0 auto; padding: 40px 24px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">

<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #047857;">EVENT · {{cfg.eventName}}</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.25; letter-spacing: -0.02em;">이벤트 참여하기</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #52525B;">무료 검진 리포트를 첨부하고 설문에 답하면 경품 추첨 대상이 됩니다. 참여 기간 {{cfg.eventPeriod}} · 당첨 발표 {{cfg.eventAnnounce}}</p>
<a href="event.html" style="align-self: flex-start; font-size: 13px; text-decoration: underline; color: #3F3F46;">이벤트 안내·경품 보기</a>
</div>

<ol style="margin: 0; padding: 0; list-style: none; border: 1px solid #E4E4E7; border-radius: 10px; background: #FAFAFA;">
<li style="padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #E4E4E7;">
<span style="flex: none; font-size: 12px; font-weight: 700; color: #71717A; width: 48px;">STEP 1</span>
<span style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px;"><strong style="font-size: 14px;">검진 프로그램 받기 (Windows)</strong><span style="font-size: 13px; color: #71717A;">휴대폰으로 보고 있다면 PC에서 이 페이지를 열어 주세요.</span></span>
<sc-if value="{{cfg.hasDownload}}" hint-placeholder-val="{{false}}"><a href="{{cfg.downloadUrl}}" rel="noopener" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 6px; background: #18181B; color: #FAFAFA; font-size: 13px; font-weight: 800;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>받기</a></sc-if>
<sc-if value="{{cfg.noDownload}}" hint-placeholder-val="{{true}}"><a href="download.html" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #D4D4D8; background: #FFFFFF; font-size: 13px; font-weight: 700;">다운로드 페이지</a></sc-if>
</li>
<li style="padding: 16px 18px; display: flex; gap: 14px; border-bottom: 1px solid #E4E4E7;">
<span style="flex: none; font-size: 12px; font-weight: 700; color: #71717A; width: 48px;">STEP 2</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><strong style="font-size: 14px;">검진하고 리포트 파일 저장</strong><span style="font-size: 13px; color: #71717A;">검진이 끝나면 나오는 리포트 파일을 PC에 저장합니다.</span></span>
</li>
<li style="padding: 16px 18px; display: flex; gap: 14px;">
<span style="flex: none; font-size: 12px; font-weight: 700; color: #71717A; width: 48px;">STEP 3</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><strong style="font-size: 14px;">아래 양식에 리포트를 첨부하고 설문 제출</strong><span style="font-size: 13px; color: #71717A;">설문 12문항, 3분이면 끝납니다.</span></span>
</li>
</ol>

<sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 28px 24px; border-radius: 10px; background: #18181B; color: #FAFAFA; display: flex; flex-direction: column; gap: 8px;">
<strong style="font-size: 17px;">이벤트 접수가 마감되었습니다</strong>
<span style="font-size: 14px; color: #D4D4D8; line-height: 1.6;">참여해 주셔서 감사합니다. 당첨 발표: {{cfg.eventAnnounce}}</span>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 28px 24px; border-radius: 10px; background: #ECFDF5; border: 1px solid #A7F3D0; display: flex; flex-direction: column; gap: 10px;">
<strong style="font-size: 19px; font-weight: 900; color: #065F46;">참여가 완료되었습니다</strong>
<span style="font-size: 14px; line-height: 1.6; color: #065F46;">접수 번호 <strong>{{receipt}}</strong> · 문의할 때 이 번호를 알려 주세요.</span>
<span style="font-size: 13px; line-height: 1.6; color: #047857;">당첨 발표: {{cfg.eventAnnounce}} · 적어 주신 이메일 또는 휴대폰 번호로 연락드립니다.</span>
<a href="index.html" style="align-self: flex-start; margin-top: 6px; display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 6px; background: #047857; color: #FFFFFF; font-size: 14px; font-weight: 800;">홈으로</a>
</div>
</sc-if>

<sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 28px;">

<section aria-labelledby="who-title" style="display: flex; flex-direction: column; gap: 18px; padding-top: 28px; border-top: 1px solid #E4E4E7;">
<h2 id="who-title" style="margin: 0; font-size: 18px; font-weight: 800;">참여자 정보</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #52525B;">당첨 확인과 경품 지급에 쓰는 정보입니다. 한 사람당 한 번(이메일·휴대폰 번호 기준)만 참여할 수 있습니다.</p>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">이름 <span style="font-size: 12px; font-weight: 500; color: #71717A;">경품을 받을 분의 이름 (2~20자) · 당첨자 발표 때는 홍*동처럼 일부를 가립니다</span>
<input type="text" name="name" maxlength="20" autocomplete="name" value="{{name}}" dc-onchange="{{onName}}" style="width: 100%; height: 48px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 15px; box-sizing: border-box; background: #FFFFFF;"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">이메일 <span style="font-size: 12px; font-weight: 500; color: #71717A;">당첨 안내를 받을 주소</span>
<input type="email" name="email" maxlength="100" autocomplete="email" inputmode="email" value="{{email}}" dc-onchange="{{onEmail}}" placeholder="example@email.com" style="width: 100%; height: 48px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 15px; box-sizing: border-box; background: #FFFFFF;"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">휴대폰 번호 <span style="font-size: 12px; font-weight: 500; color: #71717A;">당첨 연락과 경품 발송에 씁니다 · 숫자만 적어도 됩니다</span>
<input type="tel" name="phone" maxlength="13" autocomplete="tel" inputmode="tel" value="{{phone}}" dc-onchange="{{onPhone}}" placeholder="010-1234-5678" style="width: 100%; height: 48px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 15px; box-sizing: border-box; background: #FFFFFF;"></label>
<label aria-hidden="true" style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden;">비워 두세요<input type="text" name="website" tabindex="-1" autocomplete="off" value="{{hp}}" dc-onchange="{{onHp}}"></label>
</section>

<section aria-labelledby="file-title" style="display: flex; flex-direction: column; gap: 18px; padding-top: 28px; border-top: 1px solid #E4E4E7;">
<h2 id="file-title" style="margin: 0; font-size: 18px; font-weight: 800;">검진 리포트 첨부</h2>
<label style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px dashed #A1A1AA; border-radius: 10px; background: #FAFAFA; font-size: 14px; cursor: pointer;">
<strong style="font-size: 14px;">리포트 파일 선택</strong>
<span style="font-size: 12px; color: #71717A; line-height: 1.6;">{{fileHint}}</span>
<input type="file" name="report" accept="{{accept}}" dc-onchange="{{onFile}}" style="font: inherit; font-size: 13px; max-width: 100%;">
<sc-if value="{{hasFile}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 700; color: #047857; word-break: break-all;">선택됨: {{fileName}} ({{fileSizeText}})</span></sc-if>
<sc-if value="{{fileErr}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 700; color: #B91C1C;">{{fileErr}}</span></sc-if>
</label>
</section>

<section aria-labelledby="q-title" style="display: flex; flex-direction: column; gap: 28px; padding-top: 28px; border-top: 1px solid #E4E4E7;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<h2 id="q-title" style="margin: 0; font-size: 18px; font-weight: 800;">설문 (12문항)</h2>
<span style="font-size: 13px; line-height: 1.6; color: #52525B;">정답은 없습니다. 평소 생각대로 골라 주세요. 응답은 개인을 알아볼 수 없는 통계로만 씁니다.</span>
</div>
<sc-for list="{{qs}}" as="q" hint-placeholder-count="12">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<legend style="padding: 0 0 4px; font-size: 15px; line-height: 1.5; font-weight: 800;">{{q.no}}. {{q.text}} <span style="font-size: 12px; font-weight: 500; color: #B91C1C;">필수</span></legend>
<sc-if value="{{q.hasHint}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 1.5; color: #71717A;">{{q.hint}}</span></sc-if>
<sc-if value="{{q.isScale}}" hint-placeholder-val="{{false}}"><div class="cf-scale" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{q.opts}}" as="o" hint-placeholder-count="5">
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" dc-onclick="{{o.pick}}" style="min-height: 52px; padding: 6px 4px; border-radius: 8px; font: inherit; font-size: 13px; line-height: 1.3; cursor: pointer; word-break: keep-all; border: 1px solid #18181B; background: #18181B; color: #FAFAFA; font-weight: 800;">{{o.label}}</button></sc-if>
<sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" dc-onclick="{{o.pick}}" style="min-height: 52px; padding: 6px 4px; border-radius: 8px; font: inherit; font-size: 13px; line-height: 1.3; cursor: pointer; word-break: keep-all; border: 1px solid #E4E4E7; background: #FFFFFF; color: #09090B;">{{o.label}}</button></sc-if>
</sc-for>
</div></sc-if>
<sc-if value="{{q.isOne}}" hint-placeholder-val="{{false}}"><sc-for list="{{q.opts}}" as="o" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #E4E4E7; border-radius: 8px; font-size: 14px; line-height: 1.45; cursor: pointer; box-sizing: border-box;"><input type="radio" name="{{q.id}}" checked="{{o.on}}" dc-onchange="{{o.pick}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: #18181B;">{{o.label}}</label>
</sc-for></sc-if>
<sc-if value="{{q.isMulti}}" hint-placeholder-val="{{false}}"><sc-for list="{{q.opts}}" as="o" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #E4E4E7; border-radius: 8px; font-size: 14px; line-height: 1.45; cursor: pointer; box-sizing: border-box;"><input type="checkbox" checked="{{o.on}}" dc-onchange="{{o.pick}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: #18181B;">{{o.label}}</label>
</sc-for></sc-if>
</fieldset>
</sc-for>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 800;">더 바라는 점이나 불편했던 점이 있으면 적어 주세요 <span style="font-size: 12px; font-weight: 500; color: #71717A;">선택 · 500자 이내</span>
<textarea rows="4" maxlength="500" value="{{note}}" dc-onchange="{{onNote}}" placeholder="예) 중고로 팔 때 리포트를 바로 첨부할 수 있으면 좋겠어요" style="padding: 12px 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; resize: vertical;"></textarea>
</label>
</section>

<section aria-labelledby="agree-title" style="display: flex; flex-direction: column; gap: 16px; padding-top: 28px; border-top: 1px solid #E4E4E7;">
<h2 id="agree-title" style="margin: 0; font-size: 18px; font-weight: 800;">약관 및 동의</h2>

<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; cursor: pointer; padding: 14px 16px; border-radius: 10px; background: #F4F4F5; font-weight: 800;"><input type="checkbox" checked="{{all}}" dc-onchange="{{tAll}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: #18181B; margin-top: 1px;"><span>아래 내용에 모두 동의합니다 <span style="display: block; font-size: 12px; font-weight: 500; color: #71717A;">선택 항목(소식 수신)도 함께 체크됩니다. 하나씩 고를 수도 있습니다.</span></span></label>

<details style="border: 1px solid #E4E4E7; border-radius: 10px;">
<summary style="cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 800;">이벤트 참여 약관 보기</summary>
<ol style="margin: 0; padding: 0 16px 14px 34px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 1.7; color: #3F3F46;">
<li>기간: {{cfg.eventPeriod}} · 대상: {{cfg.eventTarget}}</li>
<li>한 사람당 한 번 참여할 수 있습니다. 같은 이메일이나 휴대폰 번호로는 다시 접수되지 않습니다.</li>
<li>본인 PC를 직접 검진한 리포트만 인정합니다. 다른 사람의 리포트를 내거나 내용을 고친 경우, 다른 사람의 정보로 참여하거나 한 사람이 여러 번 참여한 경우 당첨에서 제외하며 당첨 뒤에 알게 되면 당첨을 취소합니다.</li>
<li>당첨자는 접수 마감 뒤 참여자 가운데 무작위로 추첨합니다. 당첨 발표: {{cfg.eventAnnounce}}</li>
<li>당첨자는 안내를 받은 날부터 {{cfg.replyDays}}일 안에 경품 배송 정보를 회신해야 합니다. 기간 안에 회신하지 않거나 연락이 닿지 않으면 당첨이 취소되고 다른 참여자를 다시 뽑을 수 있습니다.</li>
<li>{{cfg.prizeTaxNote}}</li>
<li>경품은 현금으로 바꿀 수 없고 다른 사람에게 넘길 수 없습니다. 품절 등 사정이 생기면 같은 가치 이상의 다른 상품으로 바뀔 수 있습니다.</li>
<li>운영 사정으로 이벤트 내용이 바뀌거나 중단되면 사이트 공지사항으로 알립니다.</li>
<li>개인정보 처리는 아래 안내와 <a href="privacy.html" style="text-decoration: underline;">개인정보처리방침</a>을 따릅니다.</li>
</ol>
</details>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; cursor: pointer;"><input type="checkbox" checked="{{cTerms}}" dc-onchange="{{tTerms}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: #18181B; margin-top: 1px;"><span>[필수] 이벤트 참여 약관에 동의합니다</span></label>

<details style="border: 1px solid #E4E4E7; border-radius: 10px;">
<summary style="cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 800;">개인정보 수집·이용 안내 보기</summary>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 440px; border-collapse: collapse; font-size: 12px; line-height: 1.6;">
<tbody>

<script type="text/plain" id="dc-code">
// 설문 문항: 바꾸려면 Apps Script(tools/apps-script/Code.gs)의 QUESTIONS도 똑같이 바꿔야 합니다.
// type: scale(5점 척도, 5=매우 그렇다) / one(하나 선택) / multi(여러 개 선택, max개까지)
const SCALE = ['매우 그렇다', '그렇다', '보통이다', '그렇지 않다', '전혀 그렇지 않다'];
const QUESTIONS = [
  { id: 'q1', type: 'one', text: '지난 1년 동안 중고 PC나 PC 부품을 사거나 판 적이 있나요?',
    opts: ['사 본 적 있다', '팔아 본 적 있다', '둘 다 있다', '없다'] },
  { id: 'q2', type: 'one', text: '지난 1년 동안 중고 PC·부품을 사거나 판 금액은 모두 얼마쯤인가요?',
    opts: ['거래하지 않았다', '10만 원 미만', '10만~30만 원 미만', '30만~50만 원 미만', '50만~100만 원 미만', '100만 원 이상'] },
  { id: 'q3', type: 'scale', text: 'PC 부품을 거래하면서 어려움을 겪은 적이 있다.' },
  { id: 'q4', type: 'multi', max: 3, none: '특별히 없다', text: '중고 PC·부품을 거래할 때 가장 어렵거나 걱정되는 점은 무엇인가요?', hint: '최대 3개까지 고를 수 있습니다.',
    opts: ['부품 상태·고장 여부를 확인하기 어렵다', '적정 가격을 판단하기 어렵다', '설명과 다른 물건이 올 수 있다', '혹사·채굴 등 사용 이력을 알 수 없다', '사기·미입금이 걱정된다', '거래 뒤 문제가 생기면 해결하기 어렵다', '특별히 없다'] },
  { id: 'q5', type: 'scale', text: '부품 상태를 믿기 어려워 중고 거래를 망설이거나 포기한 적이 있다.' },
  { id: 'q6', type: 'scale', text: 'PC 부품과 중고 PC를 객관적인 지표로 거래할 수 있는 중개 거래 사이트가 있으면 좋을 것 같다.' },
  { id: 'q7', type: 'scale', text: '그런 중개 거래 사이트가 생기면 실제로 이용하겠다.' },
  { id: 'q8', type: 'one', text: '검진 리포트로 상태가 확인된 매물이라면, 일반 중고 시세보다 얼마까지 더 낼 수 있나요?', hint: '예) 시세 20만 원인 부품에서 5%는 1만 원입니다.',
    opts: ['더 낼 생각 없다', '3% 이내', '3~5%', '5~10%', '10%보다 더'] },
  { id: 'q9', type: 'scale', text: 'COMFIT 검진에 만족한다.' },
  { id: 'q10', type: 'scale', text: 'COMFIT 진단 리포트를 유료화(1,000~3,000원)하면 돈을 내고 이용할 의사가 있다.' },
  { id: 'q11', type: 'multi', max: 2, text: 'COMFIT 사이트에서 가장 이용하고 싶은 서비스는 무엇인가요?', hint: '최대 2개까지 고를 수 있습니다.',
    opts: ['진단 리포트 보관·공유 (링크·QR)', '상태가 확인된 중고 매물 구매 (SHOP)', '내 부품 판매 (장터)', '부품 시세 조회', '업그레이드·교체 추천'] },
  { id: 'q12', type: 'scale', text: 'COMFIT을 주변 사람에게 추천하겠다.' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const ans = {};
    QUESTIONS.forEach((q) => { ans[q.id] = q.type === 'multi' ? [] : (q.type === 'scale' ? 0 : ''); });
    this.state = { name: '', email: '', phone: '', hp: '', ans: ans, note: '',
      cTerms: false, c1: false, cStats: false, c2: false, c3: false,
      fileName: '', fileSize: 0, fileErr: '', errors: [], status: 'idle', receipt: '' };
    this.file = null;
  }
  cfg() { return window.COMFIT || {}; }
  exts() { return ['pdf', 'json', 'zip', 'html', 'htm', 'txt', 'png', 'jpg', 'jpeg', 'webp']; }
  maxBytes() { return (Number(this.cfg().maxFileMB) || 10) * 1024 * 1024; }
  phoneDigits(v) { return String(v || '').replace(/\D/g, ''); }
  pickFile(e) {
    const f = e && e.target && e.target.files && e.target.files[0];
    this.file = null;
    if (!f) { this.setState({ fileName: '', fileSize: 0, fileErr: '' }); return; }
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    let err = '';
    if (this.exts().indexOf(ext) < 0) err = '이 형식의 파일은 올릴 수 없습니다. (' + this.exts().join(', ') + ')';
    else if (f.size > this.maxBytes()) err = '파일이 너무 큽니다. ' + (Number(this.cfg().maxFileMB) || 10) + 'MB 이하로 올려 주세요.';
    else if (f.size === 0) err = '빈 파일입니다. 다른 파일을 골라 주세요.';
    if (!err) this.file = f;
    this.setState({ fileName: f.name, fileSize: f.size, fileErr: err });
  }
  setAns(id, v) { this.setState({ ans: { ...this.state.ans, [id]: v } }); }
  toggleMulti(q, label) {
    let cur = (this.state.ans[q.id] || []).slice();
    if (cur.indexOf(label) >= 0) cur = cur.filter((x) => x !== label);
    else if (q.none && label === q.none) cur = [label];
    else {
      cur = cur.filter((x) => x !== q.none);
      if (cur.length >= q.max) { this.setState({ errors: [q.id.slice(1) + '번은 최대 ' + q.max + '개까지 고를 수 있습니다.'] }); return; }
      cur.push(label);
    }
    this.setState({ ans: { ...this.state.ans, [q.id]: cur }, errors: [] });
  }
  check() {
    const s = this.state, errs = [];
    const name = s.name.trim(), email = s.email.trim(), phone = this.phoneDigits(s.phone);
    if (name.length < 2 || name.length > 20) errs.push('이름을 2~20자로 적어 주세요.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || email.length > 100) errs.push('이메일 주소를 확인해 주세요.');
    if (!/^01[016789]\d{7,8}$/.test(phone)) errs.push('휴대폰 번호를 확인해 주세요. (예: 010-1234-5678)');
    if (!this.file) errs.push(s.fileErr || '검진 리포트 파일을 첨부해 주세요.');
    const miss = QUESTIONS.filter((q) => { const v = s.ans[q.id]; return q.type === 'multi' ? !v.length : !v; }).map((q) => q.id.slice(1));
    if (miss.length) errs.push('설문 ' + miss.join(', ') + '번에 답해 주세요.');
    if (!s.cTerms || !s.c1 || !s.cStats || !s.c2) errs.push('[필수] 동의 네 가지에 모두 체크해 주세요.');
    return errs;
  }
  readFile(f) {
    return new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(',')[1] || '');
      r.onerror = () => no(new Error('read'));
      r.readAsDataURL(f);
    });
  }
  async send() {
    const cfg = this.cfg();
    if (this.state.status === 'sending') return;
    if (!cfg.formEndpoint) { this.setState({ errors: ['아직 접수 준비 중입니다. 잠시 뒤 다시 시도해 주세요.'] }); return; }
    const errs = this.check();
    if (errs.length) { this.setState({ errors: errs }); return; }
    this.setState({ status: 'sending', errors: [] });
    const s = this.state;
    try {
      const data = await this.readFile(this.file);
      const body = {
        form: 'event-2026-11-v2',
        name: s.name.trim(), email: s.email.trim(), phone: this.phoneDigits(s.phone), website: s.hp,
        answers: s.ans, note: s.note.slice(0, 500),
        agreeTerms: s.cTerms, agreePrivacy: s.c1, agreeStats: s.cStats, agreeAge: s.c2, agreeMarketing: s.c3,
        file: { name: this.file.name, size: this.file.size, data: data }
      };
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 90000);
      const res = await fetch(cfg.formEndpoint, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined });
      clearTimeout(timer);
      const out = await res.json();
      if (out && out.ok) { this.setState({ status: 'done', receipt: String(out.id || '') }); window.scrollTo(0, 0); }
      else this.setState({ status: 'idle', errors: [String((out && out.message) || '접수하지 못했습니다. 잠시 뒤 다시 시도해 주세요.')] });
    } catch (e) {
      this.setState({ status: 'idle', errors: ['전송하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. 계속 안 되면 문의해 주세요.'] });
    }
  }
  renderVals() {
    const s = this.state, cfg = this.cfg();
    const qs = QUESTIONS.map((q) => {
      const v = s.ans[q.id];
      let opts;
      if (q.type === 'scale') opts = SCALE.map((label, i) => { const n = 5 - i; return { label, on: v === n, off: v !== n, pick: () => this.setAns(q.id, n) }; });
      else if (q.type === 'one') opts = q.opts.map((label) => ({ label, on: v === label, off: v !== label, pick: () => this.setAns(q.id, label) }));
      else opts = q.opts.map((label) => ({ label, on: v.indexOf(label) >= 0, off: v.indexOf(label) < 0, pick: () => this.toggleMulti(q, label) }));
      return { id: q.id, no: q.id.slice(1), text: q.text, hint: q.hint || '', hasHint: !!q.hint,
        isScale: q.type === 'scale', isOne: q.type === 'one', isMulti: q.type === 'multi', opts: opts };
    });
    const all = s.cTerms && s.c1 && s.cStats && s.c2 && s.c3;
    const kb = s.fileSize / 1024;
    const closed = !cfg.eventOpen && s.status !== 'done';
    return {
      name: s.name, email: s.email, phone: s.phone, hp: s.hp, note: s.note,
      onName: (e) => this.setState({ name: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPhone: (e) => this.setState({ phone: e.target.value }),
      onHp: (e) => this.setState({ hp: e.target.value }),
      onNote: (e) => this.setState({ note: e.target.value }),
      qs: qs,
      all: all,
      tAll: () => { const v = !all; this.setState({ cTerms: v, c1: v, cStats: v, c2: v, c3: v }); },
      cTerms: s.cTerms, c1: s.c1, cStats: s.cStats, c2: s.c2, c3: s.c3,
      tTerms: () => this.setState({ cTerms: !this.state.cTerms }),
      t1: () => this.setState({ c1: !this.state.c1 }),
      tStats: () => this.setState({ cStats: !this.state.cStats }),
      t2: () => this.setState({ c2: !this.state.c2 }),
      t3: () => this.setState({ c3: !this.state.c3 }),
      accept: this.exts().map((x) => '.' + x).join(','),
      fileHint: '검진 프로그램이 만든 리포트 파일 (PDF·JSON·ZIP·HTML·TXT·이미지) · ' + (Number(cfg.maxFileMB) || 10) + 'MB 이하',
      onFile: (e) => this.pickFile(e),
      hasFile: !!s.fileName && !s.fileErr, fileName: s.fileName,
      fileSizeText: kb >= 1024 ? (kb / 1024).toFixed(1) + 'MB' : Math.max(1, Math.round(kb)) + 'KB',
      fileErr: s.fileErr,
      errors: s.errors, hasErrors: s.errors.length > 0,
      sending: s.status === 'sending',
      submitLabel: s.status === 'sending' ? '보내는 중… 창을 닫지 마세요' : (cfg.formEndpoint ? '제출하고 이벤트 참여 완료' : '접수 준비 중'),
      noEndpoint: !cfg.formEndpoint,
      submit: () => this.send(),
      done: s.status === 'done', receipt: s.receipt,
      closed: closed,
      showForm: !closed && s.status !== 'done'
    };
  }
}
</script>
<script src="config.js"></script>
<script src="runtime.js"></script>
</body>
</html>
