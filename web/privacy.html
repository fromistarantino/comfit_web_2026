<h1 id="doc-title" style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em;">COMFIT 개인정보처리방침</h1>
<span style="font-size: 13px; color: #71717A;">시행일 2026. 11. 22. · 개인정보 보호책임자 COMFIT 운영자 ({{cfg.contactText}})</span>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">COMFIT(이하 "회사")는 「개인정보 보호법」에 따라 정보주체의 개인정보를 보호하고 관련 고충을 빠르게 처리하기 위해 이 처리방침을 둡니다. 이 처리방침은 COMFIT 웹사이트와 검진 프로그램에 적용됩니다.</p>
<div style="padding: 16px 18px; border-radius: 8px; background: #ECFDF5; border: 1px solid #A7F3D0; font-size: 13px; line-height: 1.75; color: #065F46; display: flex; flex-direction: column; gap: 6px;">
<strong style="font-size: 14px;">지금 처리하는 개인정보 한눈에 보기 (이벤트 기간)</strong>
<span>현재 COMFIT은 회원가입·로그인·거래를 운영하지 않으며, <a href="join.html" style="text-decoration: underline;">이벤트 참여</a>를 위해서만 개인정보를 받습니다.</span>
<span>· 항목: 닉네임, 이메일, 검진 리포트 파일(PC 부품 구성과 측정값), 설문 응답, (선택 동의 시) 소식 수신 여부</span>
<span>· 목적: 이벤트 참여·중복 참여 확인, 추첨과 당첨 안내, 개인을 알아볼 수 없는 형태의 서비스 개선 통계</span>
<span>· 보유 기간: {{cfg.retention}}. 당첨자에게만 경품 배송을 위해 이름·연락처·주소를 따로 받고, 배송이 끝나면 파기합니다.</span>
<span>· 보관: Google LLC의 Google 스프레드시트·드라이브(해외 서버 포함)에 저장하며 운영자만 볼 수 있습니다.</span>
<span>· 검진 프로그램은 측정 기록을 이용자 PC에만 저장합니다. 현재 버전(1.0.0)은 검진 데이터 업로드와 결과표 서명 서비스를 운영하지 않아 검진 데이터를 어디에도 보내지 않습니다 (8항).</span>
<sc-if value="{{cfg.hasEmail}}" hint-placeholder-val="{{false}}"><span>· 열람·정정·삭제 요청: <a href="{{cfg.mailto}}" style="text-decoration: underline;">{{cfg.contactText}}</a></span></sc-if>
</div>
</div>
<section id="p1" aria-labelledby="p1-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p1-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">1. 개인정보의 처리 목적</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 다음 목적으로 개인정보를 처리하며, 목적이 바뀌면 「개인정보 보호법」 제18조에 따라 필요한 조치를 합니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 서비스 안내와 문의 응대</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">공모전·이벤트 운영: 참가 확인, 당첨자 선정과 안내, 경품 지급, 제세공과금 처리</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">설문: 서비스 개선을 위한 의견 수집</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">문의 응대: 문의 확인과 답변, 불만과 분쟁 처리</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원 관리: 가입 의사 확인, 회원 식별, 계정 관리, 부정 이용 방지</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">광고성 정보 전송 (선택 동의한 경우): 이벤트와 새 기능 안내</li>
</ol>
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #F4F4F5; font-size: 13px; line-height: 1.7; color: #3F3F46;">거래 서비스(주문·결제·배송·정산)는 아직 제공하지 않으며, 그에 필요한 개인정보도 수집하지 않습니다. 거래 서비스를 열기 전에 이 처리방침을 고쳐 먼저 알립니다.</p>
</section>

<h3 id="p2-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">2. 처리하는 개인정보 항목</h3>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">동의 없이 처리하는 정보는 가입·문의 화면에서 항목, 목적, 보유 기간을 알려 드리며 따로 동의를 받지 않습니다. 동의를 받는 항목은 해당 화면에서 항목별로 동의를 받고, 선택 항목에 동의하지 않아도 서비스를 이용할 수 있습니다.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 프로그램은 측정 기록(결과, 센서 기록, 로그)을 이용자 PC의 %LOCALAPPDATA%\COMFIT 폴더에 저장합니다. 정밀 검진 중 전원 설정을 되돌리기 위한 파일만 %ProgramData%\COMFIT에 잠시 두고, 이용자가 고른 위치에 저장한 결과표·내보내기 파일·오류 보고서는 그 위치에 남습니다. 로그는 최근 14개 파일만, 센서 원시 기록은 기본으로 최근 20회분만 보관합니다. 부품 일련번호, MAC 주소, Windows 계정 이름은 기록하지 않으며, 로그에 들어가는 사용자 폴더 경로는 %USERPROFILE%로 바꿔 씁니다. 이벤트 로그는 횟수·날짜·코드만 요약합니다. 기록은 프로그램의 검진 기록 화면에서 지우거나 위 폴더를 지우면 삭제됩니다.</p>

<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">파기 절차: 보유 기간이 끝났거나 처리 목적을 이룬 개인정보는 지체 없이 파기합니다. 법령에 따라 보관해야 하는 정보는 다른 정보와 분리하여 저장하고, 보관 기간이 끝나면 파기합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">파기 방법: 전자 파일은 복구할 수 없는 방법으로 지우고, 종이에 출력한 정보는 분쇄하거나 소각합니다.</li>

<section id="p5" aria-labelledby="p5-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p5-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">5. 개인정보의 제3자 제공</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 현재 개인정보를 제3자에게 제공하지 않습니다. 다만 제세공과금 신고를 위한 과세 관청 제출처럼 법령에 특별한 규정이 있는 경우에는 그에 따릅니다.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">거래 서비스를 열면서 제3자 제공이 필요해지면(예: 발송을 위해 구매자의 배송 정보를 판매자에게 제공) 받는 자, 목적, 항목, 보유 기간을 이 처리방침에 먼저 적고 필요한 동의를 받습니다.</p>
</section>

<section id="p8" aria-labelledby="p8-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p8-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">8. 검진 데이터와 진단 모델 학습</h3>

<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 분석과 AI 분석은 이용자의 PC 안에서 합니다. 측정 기록은 PC에만 저장합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>현재 버전(1.0.0) 안내</b>: 검진 데이터 업로드와 결과표 진위 확인 서명 서비스를 운영하지 않습니다. 프로그램은 동의를 받지 않고 검진 데이터를 어디에도 보내지 않으며, 결과표는 "서명 없음"으로 발급됩니다. 아래의 업로드·철회와 삭제·서명 항목은 이 서비스를 열 때 적용할 내용이며, 열기 전에 이 처리방침을 고쳐 먼저 알립니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>검진 데이터 업로드 (선택)</b>: 기본값은 "보내지 않음"입니다. 첫 실행 화면이나 설정에서 만 14세 이상임을 확인하고 동의한 경우에만, 검진이 끝날 때 2항의 항목을 COMFIT 서버(api.comfit.kr)로 보냅니다. 이름, 이메일, Windows 계정명, 일련번호, MAC 주소, 파일 경로, 이벤트 로그 본문, 원시 센서 기록은 보내지 않으며, 서버는 IP 주소를 저장하지 않습니다. 모의 데이터는 보내지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">업로드한 데이터는 진단 모델을 만들고 평가하는 데 씁니다 (통계와 학습). 개인을 알아볼 수 없는 형태이며, 다른 목적으로 쓰거나 제3자에게 팔지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>철회와 삭제</b>: 설정의 "업로드 동의 철회"를 누르면 그 뒤로 보내지 않고 아직 보내지 않은 대기열도 지웁니다. "내 업로드 데이터 삭제"를 누르면 서버에 있는 해당 설치의 데이터를 바로 지웁니다. 이미 학습을 마친 모델에서 개별 데이터를 빼낼 수는 없으며, 다음 모델 학습부터 제외합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>결과표 진위 확인 서명</b>: 이용자가 결과 화면에서 서명을 요청할 때만 결과 요약을 보냅니다. 서버는 검진 번호, 요약의 해시값, 발급 시각만 저장하며 요약 본문과 IP 주소는 저장하지 않습니다. 결과표의 QR 코드로 확인 페이지(comfit.kr/verify)에서 진위를 확인할 때 결과표 내용은 이용자의 브라우저 안에서만 확인하고 서버로 보내지 않습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>새 버전 확인</b>: 프로그램은 첫 실행 안내를 마친 뒤부터, 시작할 때 comfit.kr에서 최신 버전 정보 파일을 받습니다. 프로그램이 보내는 정보는 없지만, 이 요청 때문에 웹사이트를 호스팅하는 업체(GitHub)가 접속 IP 주소와 시각을 처리할 수 있습니다. 설정에서 끌 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;"><b>오류 보고서</b>: 자동으로 보내지 않습니다. 이용자가 직접 만든 보고서(최근 로그·프로그램 버전·하드웨어 요약, 개인 식별 값은 가림)를 직접 보낼 때만 받습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">진단 결과는 PC 부품의 상태에 대한 판단이며, 정보주체 개인에 대한 평가나 자동화된 결정에 쓰지 않습니다.</li>
</ol>
</section>
<section id="p9" aria-labelledby="p9-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p9-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">9. 정보주체의 권리와 행사 방법</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">정보주체는 언제든지 개인정보의 열람, 정정·삭제, 처리 정지, 동의 철회를 요구할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">이메일({{cfg.contactText}})로 요청하면 회사는 10일 이내에 조치하고 결과를 알립니다. 검진 프로그램으로 보낸 업로드 데이터는 프로그램 설정의 "내 업로드 데이터 삭제"로 바로 지울 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">법정대리인이나 위임을 받은 사람을 통해서도 요구할 수 있으며, 이 경우 위임장을 제출해야 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">다른 법령에서 수집 대상으로 정한 개인정보는 삭제를 요구할 수 없습니다.</li>
</ol>
</section>
<section id="p10" aria-labelledby="p10-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p10-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">10. 개인정보의 안전성 확보 조치</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">관리적 조치: 내부 관리계획 수립·시행, 개인정보를 다루는 사람 최소화와 정기 교육</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">기술적 조치: 비밀번호 일방향 암호화, 전송 구간 암호화(HTTPS), 접근 권한 관리, 접속 기록 보관과 위·변조 방지, 보안 업데이트</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">물리적 조치: 데이터는 수탁자(Google, GitHub)의 데이터센터에 보관하며, 회사 안에 종이 문서를 둘 때는 잠금 장치가 있는 곳에 보관</li>
</ul>
</section>
<section id="p11" aria-labelledby="p11-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p11-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">11. 자동으로 수집하는 장치의 설치·운영과 거부</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 로그인 유지와 "오늘 하루 보지 않기" 같은 화면 설정을 기억하기 위해 쿠키와 브라우저 저장소를 씁니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 브라우저 설정에서 쿠키 저장을 거부하거나 지울 수 있습니다. 거부하면 로그인 유지 등 일부 기능을 쓰기 어려울 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 현재 맞춤형 광고를 위한 행태정보를 수집하지 않습니다. 이용 통계 도구를 도입하면 이 처리방침에 도구 이름과 거부 방법을 먼저 적습니다.</li>
</ol>
