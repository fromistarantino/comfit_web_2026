<h1 id="doc-title" style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em;">COMFIT 개인정보처리방침</h1>
<span style="font-size: 13px; color: #71717A;">시행일 [사업자 확인 필요] · 개인정보 보호책임자 [사업자 확인 필요]</span>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">[사업자 확인 필요: 상호](이하 "회사")는 「개인정보 보호법」에 따라 정보주체의 개인정보를 보호하고 관련 고충을 빠르게 처리하기 위해 이 처리방침을 둡니다. 이 처리방침은 COMFIT 웹사이트와 검진 프로그램에 적용됩니다.</p>
<div style="padding: 16px 18px; border-radius: 8px; background: #ECFDF5; border: 1px solid #A7F3D0; font-size: 13px; line-height: 1.75; color: #065F46; display: flex; flex-direction: column; gap: 6px;">
<strong style="font-size: 14px;">지금 처리하는 개인정보 한눈에 보기 (이벤트 기간)</strong>
<span>현재 COMFIT은 회원가입·로그인·거래를 운영하지 않으며, <a href="join.html" style="text-decoration: underline;">이벤트 참여</a>를 위해서만 개인정보를 받습니다.</span>
<span>· 항목: 닉네임, 이메일, 검진 리포트 파일(PC 부품 구성과 측정값), 설문 응답, (선택 동의 시) 소식 수신 여부</span>
<span>· 목적: 이벤트 참여·중복 참여 확인, 추첨과 당첨 안내, 개인을 알아볼 수 없는 형태의 서비스 개선 통계</span>
<span>· 보유 기간: {{cfg.retention}}. 당첨자에게만 경품 배송을 위해 이름·연락처·주소를 따로 받고, 배송이 끝나면 파기합니다.</span>
<span>· 보관: Google LLC의 Google 스프레드시트·드라이브(해외 서버 포함)에 저장하며 운영자만 볼 수 있습니다.</span>
<span>· 검진 프로그램은 측정 기록을 이용자 PC에 저장하며, 이용자가 직접 첨부한 리포트만 운영자에게 전달됩니다.</span>
<sc-if value="{{cfg.hasEmail}}" hint-placeholder-val="{{false}}"><span>· 열람·정정·삭제 요청: <a href="{{cfg.mailto}}" style="text-decoration: underline;">{{cfg.contactEmail}}</a></span></sc-if>
</div>
</div>
<section id="p1" aria-labelledby="p1-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p1-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">1. 개인정보의 처리 목적</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 다음 목적으로 개인정보를 처리하며, 목적이 바뀌면 「개인정보 보호법」 제18조에 따라 필요한 조치를 합니다.</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 서비스 안내와 문의 응대</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">공모전·이벤트 운영: 참가 확인, 당첨자 선정과 안내, 경품 지급, 제세공과금 처리</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">설문: 서비스 개선을 위한 의견 수집</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">문의 응대: 문의 확인과 답변, 불만과 분쟁 처리</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원 관리: 가입 의사 확인, 회원 식별, 계정 관리, 부정 이용 방지</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">광고성 정보 전송 (선택 동의한 경우): 이벤트와 새 기능 안내</li>
</ol>
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #F4F4F5; font-size: 13px; line-height: 1.7; color: #3F3F46;">거래 서비스(주문·결제·배송·정산)는 아직 제공하지 않으며, 그에 필요한 개인정보도 수집하지 않습니다. 거래 서비스를 열기 전에 이 처리방침을 고쳐 먼저 알립니다.</p>
</section>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">검진 프로그램은 측정 기록을 이용자의 PC에 저장합니다. 이 기록에는 부품 시리얼 번호, 네트워크 어댑터의 MAC 주소, Windows 사용자 폴더 경로, 시스템 이벤트 메시지가 들어갈 수 있습니다. PC 안의 기록은 프로그램 폴더의 runs 폴더를 지우면 삭제됩니다.</p>

<p style="margin: 0; font-size: 14px; line-height: 1.85; color: #3F3F46;">거래 서비스를 열면서 제3자 제공이 필요해지면(예: 발송을 위해 구매자의 배송 정보를 판매자에게 제공) 받는 자, 목적, 항목, 보유 기간을 이 처리방침에 먼저 적고 필요한 동의를 받습니다.</p>

<section id="p8" aria-labelledby="p8-h" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px;">
<h3 id="p8-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">8. 검진 데이터의 업로드와 진단 모델 학습 (검토용 초안 · 현재 적용하지 않음)</h3>

<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">업로드를 제공하는 경우, 이용자가 업로드를 선택한 때에만 결과표 발급과 진위 확인에 필요한 항목을 서버로 보냅니다. 보내는 항목은 실제 전송 내용을 확인한 뒤 적습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">시리얼 번호, MAC 주소, 사용자 폴더 경로처럼 개인을 알아볼 수 있는 값을 보내지 않도록 설계하고, 전송 내용을 시험으로 확인한 뒤에만 "보내지 않는다"고 적습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">업로드한 측정값을 진단 모델의 학습에 쓰려면 업로드 동의와 별도로 선택 동의를 받습니다. 동의하지 않아도 결과표 발급과 진위 확인을 이용할 수 있어야 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">동의 철회를 받으면 그 뒤의 학습에서 해당 측정값을 빼는 절차와 처리 기한을 정해 적습니다. 이미 학습을 마친 모델에 대한 처리 방법도 함께 정합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">진단 결과는 PC 부품의 상태에 대한 판단이며, 정보주체 개인에 대한 평가나 자동화된 결정에 쓰지 않습니다.</li>
</ol>
</section>

<h3 id="p9-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">9. 정보주체의 권리와 행사 방법</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">정보주체는 언제든지 개인정보의 열람, 정정·삭제, 처리 정지, 동의 철회를 요구할 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">계정 설정에서 직접 하거나 1:1 문의로 요청하면 회사는 10일 이내에 조치하고 결과를 알립니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">법정대리인이나 위임을 받은 사람을 통해서도 요구할 수 있으며, 이 경우 위임장을 제출해야 합니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">다른 법령에서 수집 대상으로 정한 개인정보는 삭제를 요구할 수 없습니다.</li>
</ol>
</section>

<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">기술적 조치: 비밀번호 일방향 암호화, 전송 구간 암호화(HTTPS), 접근 권한 관리, 접속 기록 보관과 위·변조 방지, 보안 업데이트</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">물리적 조치: 데이터는 [사업자 확인 필요: 호스팅 업체]의 데이터센터에 보관하며, 회사 안에 종이 문서를 둘 때는 잠금 장치가 있는 곳에 보관</li>

<h3 id="p11-h" style="margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;">11. 자동으로 수집하는 장치의 설치·운영과 거부</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px;">
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 로그인 유지와 "오늘 하루 보지 않기" 같은 화면 설정을 기억하기 위해 쿠키와 브라우저 저장소를 씁니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회원은 브라우저 설정에서 쿠키 저장을 거부하거나 지울 수 있습니다. 거부하면 로그인 유지 등 일부 기능을 쓰기 어려울 수 있습니다.</li>
<li style="font-size: 14px; line-height: 1.85; color: #3F3F46;">회사는 현재 맞춤형 광고를 위한 행태정보를 수집하지 않습니다. 이용 통계 도구를 도입하면 이 처리방침에 도구 이름과 거부 방법을 먼저 적습니다.</li>
