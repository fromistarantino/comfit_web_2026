<script type="text/plain" id="dc-code">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { demo: '' };
  }
  renderVals() {
    const s = this.state;
    const text = {
      copy: ['링크 복사는 아직 준비 중이에요', '정식 공개 후 이 결과표의 고유 링크를 복사해 거래 글에 붙일 수 있습니다.'],
      pdf: ['PDF 저장은 아직 준비 중이에요', '정식 공개 후 A4 한 장으로 저장하거나 인쇄할 수 있습니다.']
    };
    const d = text[s.demo] || text.copy;
    return {
      demoOpen: !!s.demo, demoTitle: d[0], demoBody: d[1],
      askCopy: () => this.setState({ demo: 'copy' }),
      askPdf: () => this.setState({ demo: 'pdf' }),
      closeDemo: () => this.setState({ demo: '' })
    };
  }
}
</script>
