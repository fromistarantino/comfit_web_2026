# main 브랜치에 글·설정을 고쳐 저장(commit)하면 자동으로 사이트(gh-pages)에 배포합니다.
# 진행 상황: 저장소의 Actions 탭. 보통 2~3분 걸립니다.
# 이 저장소에 새 릴리스(Releases)를 공개·수정·삭제해도 다시 배포해 다운로드 페이지를 최신 버전으로 바꿉니다.
name: 사이트 배포

on:
  push:
    branches: [main]
    paths: ['web/**', 'mobile/**', 'tools/deploy.py', 'tools/prerender.js', 'tools/release.py', 'deploy.json', '.github/workflows/deploy.yml']
  release:
    types: [published, edited, deleted, unpublished, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 릴리스 때도 태그가 아니라 main의 최신 사이트를 배포
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 미리 그리기 도구 설치
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: 배포 폴더 만들기
        run: python3 tools/deploy.py
      - name: 최신 릴리스 정보 넣기 (다운로드 주소·버전·크기·SHA-256)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release.py dist
      - name: 화면 미리 그리기 (오류가 있으면 배포를 멈춤)
        run: node tools/prerender.js dist
      - name: gh-pages 브랜치에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "배포: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
